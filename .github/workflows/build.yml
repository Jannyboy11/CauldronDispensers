name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: 25
          cache: 'maven'
      - name: Install CraftBukkit and Paper
        run: |
          wget -O BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          java -jar BuildTools.jar --rev 26.3 --compile craftbukkit
          mvn ca.bkaw:paper-nms-maven-plugin:init --pl :PaperCompat
      - name: Compile CauldronDispensers
        run: |
          mvn clean package install --batch-mode --update-snapshots -DfinalName=CauldronDispensers
      - name: Upload CauldronDispensers
        uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: CauldronDispensers
          archive: false
          path: BukkitPlugin/target/CauldronDispensers.jar

  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    # required for action-gh-release@v3
    permissions:
      contents: write

    steps:
      - name: Download CauldronDispensers
        uses: actions/download-artifact@v8
        with:
          name: CauldronDispensers
      - name: Create tagged release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            CauldronDispensers.jar
